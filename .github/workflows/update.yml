name: Sync QX AdBlock to Loon

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loon-adblock-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run conversion tests
        run: python3 -m unittest discover -s tests -v

      - name: Download, validate, and convert upstream lists
        run: python3 sync.py

      - name: Commit only when rules have changed
        run: |
          git add loon/
          if git diff --cached --quiet; then
            echo "Rule contents are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: refresh Loon blocking lists"
          git push
